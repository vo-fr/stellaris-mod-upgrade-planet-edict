 edict_upgrade_planet_bulk_191:0 "Améliorer les bâtiments"
 edict_upgrade_planet_bulk_191_desc:0 "Lance les améliorations disponibles des mines, centrales électriques et fermes sur cette planète, y compris les bâtiments de base. Les coûts en minéraux et les durées de construction habituels s’appliquent."
